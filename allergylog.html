<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allergies Logs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #faf2ff;
    }

    .form-container {
      padding: 20px;
      background-color: white;
      border-radius: 10px;
    }

    .main-section {
      margin-top: 30px;
    }

    h3 {
      color: rgb(167, 60, 184);
    }
    .custom-add-button, .custom-display-button {
      top: 70%;
      left: 50%;
      background-color: #ff914d;
      border: 0.16em solid #ff914d;
      color: rgb(255, 255, 255);
      border-radius: 15rem;
    }

    .custom-add-button:hover, .custom-display-button:hover {
      background-color:#9c3fb9;
      color:rgb(251,243,251);
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="text-center mt-4 p-5 bg-white rounded">
      <h1 style="color:rgb(167,60,184);"><img src="assets/AllergyLogo.png" alt="Logo" style="max-width: 15%;"> Allergy Log</h1>
    </div>

    <div class="navcontent mt-3">
      <ul class="nav nav-tabs nav-justified">
        <li class="nav-item">
          <a class="nav-link" href="home.html" style="color:rgb(167,60,184);">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="log.html" style="background-color: rgb(167,60,184); color:#ffffff;">Logs</a>
        </li>
      </ul>
    </div>

    <!-- Main Section for Form and List -->
    <div class="row main-section">
      <!-- Left side (Form) -->
      <div class="col-md-6">
        <div class="form-container">
          <h3>Add Allergy</h3>
          <form id="allergyForm">
            <div class="mb-3">
              <label for="ingredient" class="form-label">Ingredient Name:</label>
              <input type="text" class="form-control" id="ingredient" name="ingredient" required>
            </div>
            <button type="submit" class="btn custom-add-button">Add Allergy</button>
          </form>
        </div>
      </div>

      <!-- Right side (Display Allergies) -->
      <div class="col-md-6">
        <div>
          <h3>View Allergies</h3>
          <button class="btn custom-display-button mb-3" id="displayButton">Display Allergies</button>
          <ul id="allergyList" class="list-group">
            <!-- Allergies will be displayed here -->
          </ul>
        </div>
      </div>
    </div>

    <!-- Bootstrap modal for success message -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="successModalLabel">Success</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Allergy added successfully!
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Add Allergy Handler
  document.getElementById('allergyForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const allergen = document.getElementById('ingredient').value;

      try {
          const response = await fetch('/add-allergy', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
              },
              body: new URLSearchParams({ allergen })
          });

          if (response.ok) {
              document.getElementById('ingredient').value = '';
              alert('Allergy added successfully!');
          } else {
              alert('Error adding allergy. Please try again.');
          }
      } catch (error) {
          console.error('Error adding allergy:', error);
          alert('An error occurred. Please try again later.');
      }
  });

  // Display Allergies Handler
  document.getElementById('displayButton').addEventListener('click', async function () {
      try {
          const response = await fetch('/get-allergies');
          if (!response.ok) {
              throw new Error('Failed to fetch allergies');
          }

          const allergies = await response.json();
          console.log(allergies); // Log fetched allergies

          const allergyList = document.getElementById('allergyList');
          allergyList.innerHTML = '';

          // Iterate through allergies and display them with a delete button
          allergies.forEach((allergy) => {
              const listItem = document.createElement('li');
              listItem.classList.add('list-group-item', 'd-flex', 'justify-content-between', 'align-items-center');
              listItem.textContent = allergy.name;

              // Create trash icon button for deleting
              const trashIcon = document.createElement('i');
              trashIcon.classList.add('far', 'fa-trash-alt', 'text-info', 'delete-icon');
              trashIcon.style.cursor = 'pointer';

              // Add delete functionality
              trashIcon.addEventListener('click', async function () {
                  const deleteConfirmed = confirm(`Are you sure you want to delete ${allergy.name}?`);
                  if (deleteConfirmed) {
                      try {
                          const deleteResponse = await fetch(`/delete-allergy?name=${encodeURIComponent(allergy.name)}`, {
                              method: 'DELETE',
                          });

                          if (deleteResponse.ok) {
                              listItem.remove(); // Remove the list item from the UI
                              alert(`${allergy.name} was successfully deleted!`); // Success alert
                          } else {
                              alert('Error deleting allergy.');
                          }
                      } catch (error) {
                          console.error('Error deleting allergy:', error);
                          alert('An error occurred while deleting the allergy.');
                      }
                  }
              });

              listItem.appendChild(trashIcon);
              allergyList.appendChild(listItem);
          });
      } catch (error) {
          console.error('Error fetching allergies:', error);
          alert('Failed to load allergies. Please try again later.');
      }
  });
</script>


</body>
</html>
