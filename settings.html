<div class="card">
  <div class="card-body">
    <h4 class="card-title">Account Details</h4>
    <p class="card-text" id="get-account">Name : 
    
    </p>
  </div>
      <br>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      // Fetch the account information from the server
      const response = await fetch('/display-account');
      
      // Check for any errors in the response
      if (!response.ok) {
        throw new Error('Error fetching account data');
      }

      const info = await response.json();

      // Check if the response contains an error
      if (info.error) {
        document.getElementById('get-account').innerHTML = `<p>Error: ${info.error}</p>`;
        return;
      }

      // Populate the account details
      const accountDetails = `
        <p><strong>First Name:</strong> ${info.userFirstName || 'N/A'}</p>
        <p><strong>Last Name:</strong> ${info.lastName || 'N/A'}</p>
        <p><strong>Email Address:</strong> ${info.emailAddress || 'N/A'}</p>
        <p><strong>Password:</strong> ${info.userPassword || 'N/A'}</p>
      `;

      // Inject the account details into the DOM
      document.getElementById('get-account').innerHTML = accountDetails;

    } catch (error) {
      console.error('Error fetching account information:', error);
      document.getElementById('get-account').innerHTML = `<p>Error loading account information</p>`;
    }
  });
</script>
