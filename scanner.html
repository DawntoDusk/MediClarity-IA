<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="/style.css" />

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<style>
    *{
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    .image-text-button {
        display: flex;
        align-items: center;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .image-text-button img {
        margin-right: 10px;
        width: 20px;
        height: 20px;
    }

    .image-text-button:hover {
        background-color: rgb(167,60,184);
    }
</style>

<div class="main">
<body style="background-color: #faf2ff;">
<div class="container mt-3">
    <div class="mt-4 p-5 bg-white rounded" style=" padding:25px ; text-align:center; color:rgb(167,60,184);">
    <h1> <img src="assets/ScannerLogo.png" alt="Logo" style="max-width: 15%;">Scanner</h1> 
    </div>

    <div class="navcontent" style="padding-top: 25px; font-size: 20px; ">
        <ul class="nav nav-tabs nav-justified">
          <li class="nav-item">
            <a class="nav-link" href="home.html" style="color:rgb(167,60,184);">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="log.html" style="color:rgb(167,60,184);">Logs</a>
          </li>
        </ul>
      </div>
</body>
</div>

<div>
    <form action="http://localhost:4000/upload" method="POST" enctype="multipart/form-data" style="padding-top: 5%; text-align: center;">
        <!-- Hidden File Input -->
        <input type="file" id="myFile" name="image" style="display: none;" onchange="showFileName()">
        <!-- Custom "Choose File" Button -->
        <label for="myFile" class="custom-file-upload">Choose File</label>
        <!-- Display the file name here -->
        <span id="file-name" style="margin-left: 10px;">No file chosen</span>
        <!-- Submit Button, initially hidden -->
        <input type="submit" id="signUp" style="display: none;">
    </form>
      
</div>

<style>
/* Custom file upload button styling */
.custom-file-upload {
    background-color: white;
    border: 0.16em solid rgb(255, 255, 255);
    color: rgb(167, 60, 184);
    padding: 10px 20px;
    border-radius: 15rem;
    cursor: pointer;
    display: inline-block;
}

.custom-file-upload:hover {
    background-color: #9c3fb9;
    color: rgb(251, 243, 251);
}
</style>

<script>
// Function to display the chosen file name and show the submit button
function showFileName() {
    var fileInput = document.getElementById('myFile');
    var fileName = fileInput.files[0].name; // Get the file name
    document.getElementById('file-name').textContent = fileName; // Display the file name

    // Show the submit button after the file is chosen
    document.getElementById('signUp').style.display = 'inline-block';
}
</script>


</html>
